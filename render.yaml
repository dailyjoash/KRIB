services:
  - type: web
    name: krib-backend
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn krib_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_COLLECTSTATIC
        value: "1"
      - key: KRIB_LOAD_DEMO_DATA
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_USE_SSL
        sync: false
      - key: MYSQL_SSL_CA
        sync: false
      - key: MYSQL_CHARSET
        value: utf8mb4
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: BUSINESS_NAME
        value: KRIB
      - key: SUPPORT_PHONE
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: BUSINESS_ADDRESS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Real outbound mail. Override to console backend in a staging service
      # ONLY if you are knowingly redirecting all mail to logs.
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "1"
      - key: EMAIL_USE_SSL
        value: "0"
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        sync: false
      - key: MPESA_BUSINESS_NAME
        value: KRIB
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      # PayPal mode and base must be explicitly set per environment so we
      # never silently ship a "production" service still pointing at sandbox.
      - key: PAYPAL_MODE
        sync: false
      - key: PAYPAL_API_BASE
        sync: false
      - key: PAYPAL_CURRENCY
        value: KES
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: kes
      - key: AFRICASTALKING_USERNAME
        sync: false
      - key: AFRICASTALKING_API_KEY
        sync: false
      - key: AFRICASTALKING_SENDER_ID
        sync: false
      # Per-environment so a production deploy cannot silently keep sending
      # SMS via the Africa's Talking sandbox.
      - key: AFRICASTALKING_SMS_URL
        sync: false
      # IntaSend webhook + API credentials. Settings.py refuses to boot if
      # INTASEND_WEBHOOK_SECRET is missing or shorter than 32 characters when
      # DJANGO_DEBUG=0.
      - key: INTASEND_API_TOKEN
        sync: false
      - key: INTASEND_PUBLISHABLE_KEY
        sync: false
      - key: INTASEND_WEBHOOK_SECRET
        sync: false
      - key: INTASEND_TEST_MODE
        sync: false
      # Currency the payment core validates incoming provider events against.
      - key: DEFAULT_PAYMENT_CURRENCY
        value: KES
