services:
  mysql:
    image: mysql:8.4
    container_name: krib-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: krib_db
      MYSQL_USER: krib_user
      MYSQL_PASSWORD: krib_password
      MYSQL_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: krib-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    container_name: krib-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: replace-me
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:5173
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:5173
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_LOG_LEVEL: INFO
      JWT_ACCESS_MINUTES: "60"
      JWT_REFRESH_DAYS: "7"
      DATABASE_URL: mysql://krib_user:krib_password@mysql:3306/krib_db
      MYSQL_CHARSET: utf8mb4
      DJANGO_CONN_MAX_AGE: "60"
      PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:8000
      VITE_API_URL: http://localhost:8000
      BUSINESS_NAME: KRIB LTD
      SUPPORT_PHONE: +254751558762
      SUPPORT_EMAIL: support@krib.co.ke
      BUSINESS_ADDRESS: Nairobi, Kenya
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-174379}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-http://localhost:8000/api/mpesa/callback/}
      INTASEND_API_TOKEN: ${INTASEND_API_TOKEN:-}
      INTASEND_PUBLISHABLE_KEY: ${INTASEND_PUBLISHABLE_KEY:-}
      INTASEND_TEST_MODE: ${INTASEND_TEST_MODE:-1}
      INTASEND_WEBHOOK_SECRET: ${INTASEND_WEBHOOK_SECRET:-}
      CALLBACK_PATH_SECRET: ${CALLBACK_PATH_SECRET:-krib-cb}
      MPESA_BUSINESS_NAME: ${MPESA_BUSINESS_NAME:-KRIB}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-KES}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-kes}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: >
      sh -c "python manage.py migrate &&
      python manage.py seed_krib &&
      python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    container_name: krib-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      VITE_PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-KES}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mysql_data:
