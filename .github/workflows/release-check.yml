name: Release Check

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: krib_db
          MYSQL_USER: krib_user
          MYSQL_PASSWORD: krib_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: mysql://krib_user:krib_password@127.0.0.1:3306/krib_db
        run: python manage.py test

      - name: Run Django deploy checks
        working-directory: backend
        env:
          DATABASE_URL: mysql://krib_user:krib_password@127.0.0.1:3306/krib_db
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "12345678901234567890123456789012345678901234567890"
          DJANGO_ALLOWED_HOSTS: "example.com"
          DJANGO_CORS_ALLOWED_ORIGINS: "https://app.example.com"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://app.example.com"
          DJANGO_SECURE_SSL_REDIRECT: "1"
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
