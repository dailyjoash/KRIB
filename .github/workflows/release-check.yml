name: Release Check

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: krib_db
          MYSQL_USER: krib_user
          MYSQL_PASSWORD: krib_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install libmagic (required by python-magic)
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: mysql://krib_user:krib_password@127.0.0.1:3306/krib_db
        run: python manage.py test

      - name: Run Django deploy checks
        working-directory: backend
        env:
          DATABASE_URL: mysql://krib_user:krib_password@127.0.0.1:3306/krib_db
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-secret-key-please-replace-12345678901234567890"
          DJANGO_ALLOWED_HOSTS: "example.com"
          DJANGO_CORS_ALLOWED_ORIGINS: "https://app.example.com"
          DJANGO_CSRF_TRUSTED_ORIGINS: "https://app.example.com"
          DJANGO_SECURE_SSL_REDIRECT: "1"
          INTASEND_WEBHOOK_SECRET: "ci-only-intasend-webhook-secret-please-replace-1234567890"
          # When STRIPE_SECRET_KEY is set in real deploys, STRIPE_WEBHOOK_SECRET
          # must also be present (settings.py now enforces this at boot). The
          # CI deploy check leaves STRIPE_SECRET_KEY unset so we don't need it,
          # but operators editing this file should add both together.
          DEFAULT_PAYMENT_CURRENCY: "KES"
        run: |
          python manage.py check --deploy
          python manage.py collectstatic --noinput

      - name: pip-audit (advisory)
        # Advisory only; failing dependencies should be triaged but not block
        # the build until we have an explicit allow-list.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (advisory)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build
