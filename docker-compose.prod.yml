services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-krib_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_GUNICORN_WORKERS: ${DJANGO_GUNICORN_WORKERS:-3}
      DJANGO_GUNICORN_TIMEOUT: ${DJANGO_GUNICORN_TIMEOUT:-120}
      DJANGO_COLLECTSTATIC: ${DJANGO_COLLECTSTATIC:-1}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/krib_db}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DJANGO_CONN_MAX_AGE: ${DJANGO_CONN_MAX_AGE:-60}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      BUSINESS_NAME: ${BUSINESS_NAME:-KRIB LTD}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@krib.app}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
      MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
      MPESA_SHORTCODE: ${MPESA_SHORTCODE:-}
      MPESA_PASSKEY: ${MPESA_PASSKEY:-}
      MPESA_CALLBACK_URL: ${MPESA_CALLBACK_URL:-}
      MPESA_BUSINESS_NAME: ${MPESA_BUSINESS_NAME:-KRIB}
      MPESA_OAUTH_URL: ${MPESA_OAUTH_URL:-https://sandbox.safaricom.co.ke/oauth/v1/generate?grant_type=client_credentials}
      MPESA_STK_PUSH_URL: ${MPESA_STK_PUSH_URL:-https://sandbox.safaricom.co.ke/mpesa/stkpush/v1/processrequest}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_SECRET: ${PAYPAL_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_API_BASE: ${PAYPAL_API_BASE:-https://api-m.sandbox.paypal.com}
      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-KES}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-kes}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      AFRICASTALKING_SENDER_ID: ${AFRICASTALKING_SENDER_ID:-}
      AFRICASTALKING_SMS_URL: ${AFRICASTALKING_SMS_URL:-https://api.africastalking.com/version1/messaging}
      KRIB_LOAD_DEMO_DATA: ${KRIB_LOAD_DEMO_DATA:-0}
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      - postgres
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py run_periodic_tasks"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-1}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/krib_db}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-disable}
      DJANGO_CONN_MAX_AGE: ${DJANGO_CONN_MAX_AGE:-60}
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-60}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      BUSINESS_NAME: ${BUSINESS_NAME:-KRIB LTD}
      SUPPORT_PHONE: ${SUPPORT_PHONE:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@krib.app}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-3600}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_PAYPAL_CLIENT_ID: ${VITE_PAYPAL_CLIENT_ID:-}
        VITE_PAYPAL_CURRENCY: ${VITE_PAYPAL_CURRENCY:-KES}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - media_data:/usr/share/nginx/media:ro

volumes:
  postgres_data:
  media_data:
  static_data:
